kind: component
name: browser-backend
version: 4.5.0
stage: ga
output_namespace: browser
config:
  dynamic_styles:
    type: bool
    optional: true
  additional_scopes:
    type: list
    optional: true
    items:
      type: string
  telemetry_service_name:
    type: string
    optional: true
  api_prefix:
    type: string
  logout_scope:
    type: string
    optional: true
  roles_claim:
    type: string
    optional: true
  routes:
    type: list
    items:
      type: string
  asset_bundle:
    type: string
    optional: true
  assets:
    type: list
    optional: true
    items:
      source:
        type: string
      path:
        type: string
requires:
  - storage-adapter
  - tracing
  - health-endpoint
provides:
  - browser-session-http
slots: []

# The architecture role (ST-SUP-EN09 field Architecture role, ST-SUP-UC01-R05): the layer, the part in a request
# flow, and the side of each port. The architecture model places the component from it alone.
architecture:
  layer: edge
  flow: "Serves the browser session over HTTP and passes its calls to the service."
  ports:
    storage-adapter: outbound
    tracing: outbound
    health-endpoint: outbound
    browser-session-http: inbound
