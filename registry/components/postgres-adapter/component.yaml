    secret: false
  - name: PGPASSWORD
    type: string
    required: false
    description: "Read by the pgx driver for a part that the connection string does not give. The service does not start when it has a value: give the part in DATABASE_URL."
    secret: true
  - name: PGPORT
    type: string
    required: false
