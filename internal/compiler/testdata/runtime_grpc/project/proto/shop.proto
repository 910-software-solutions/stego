syntax = "proto3";

package shop.v1;

// AddNoteRequest is the request of add-note.
message AddNoteRequest {
  string order_id = 1;
  string text = 2;
}

// AddNoteResponse is the response of add-note.
message AddNoteResponse {
  string note_id = 1;
}

// PlaceOrderRequest is the request of place-order.
message PlaceOrderRequest {
  string sku = 1;
  int32 qty = 2;
  string email = 3;
  // note_on names an order to which the command adds a note with the text note.
  string note_on = 4;
  string note = 5;
}

// PlaceOrderResponse is the response of place-order.
message PlaceOrderResponse {
  string order_id = 1;
}
