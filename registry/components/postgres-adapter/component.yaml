# Version 6.13.0 stores a readable secret field as sealed bytes (bytea) and a compare-only one as its Argon2id hash
# (text), with no CHECK and no index, and emits the re-seal statements of each readable secret (ST-SUP-RC01-OC48,
# decision ST-DECL-Q44).
# Version 6.14.0 carries out the seal step: at expand the sealed column <column>_sealed beside the clear one, the
# release reports and the seal checkpoint, the seal job statements, and at contract the check of each row and the drop
# of the clear column (ST-SUP-RC01-OC49, ST-SUP-RC01-OC50, decision ST-DECL-Q44).
# Version 6.15.0 refuses a changed body of an applied migration with a fault that names the migration, the two
# digests and the remedy, and gives the digest of each migration to the start check of the service runtime
# (ST-SUP-RC01-OC51, ST-SUP-RP14-LC13).
# Version 6.16.0 builds the contract step of a rename or a retype of a field with a default: it first gives the new
# column the default, with the comment of a relaxed form that states it, so the release of the change still holds its
# schema manifest (ST-SUP-RC01-OC39, walkthrough 14 W14-B3).
# Version 6.17.0 makes the row of the lease of the seal job in the transaction of the expand migration of a seal, so a
# later migration job on a restored database makes it too, and the refusal of the seal contract names the migration
# job of the release of the expand step (ST-SUP-RC01-OC49; walkthrough 14, W14-B7).
# Version 6.18.0 marks the clear column of each open seal as droppable in the schema manifest, so a start without it
# is ready (walkthrough 15, W15-B4, ST-SUP-RC01-OC12).
# Version 6.19.0 reads a field written sensitivity: public as a field with no sensitivity, so its table has the search
# index of a list on it, and a seal from public keeps that index in 001_initial and on the clear column until the
# contract step, as a seal with no from (decision ST-DECL-Q46 (a); ST-SUP-RC01-OC49; walkthrough 15, W15-B1).
# Version 6.20.0 makes the seal checkpoint keep the database instance where a start of the seal job last saw the row,
# and the time of that first sight, so the 3-minute wait of the first pass applies also after a restore, which keeps
# created_at from the dump (ST-SUP-RP09-LC15; security review of PR #470).
# Version 6.21.0 adds the OID and the file node of stego_schema.seals to the database instance of the seal checkpoint,
# makes the first start in a new instance end the pass of the row, also a completed one, and makes the contract step of
# a seal refuse a pass that did not run in this instance (ST-SUP-RP09-LC15, ST-SUP-RC01-OC50; security review of
# PR #471, L1, L3).
# Version 6.22.0 makes the ledger check name the ledger row, the migration and the remedy when the ledger is not the
# history of the release, such as on a shared preview database that ran the build of a branch, and the job logs it
# (ST-SUP-RC01-OC51; walkthrough 19, W19-T2).
# Version 6.23.0 adds the columns and the default of stego_schema.seals only when they are not there, so the run of the
# seal checkpoints at each migration job takes no ACCESS EXCLUSIVE lock on a database that has them, and the check of a
# seal contract step runs the seal checkpoints in its own transaction (ST-SUP-RC01-OC49, ST-SUP-RC01-OC50; security
# review of PR #472, I2, and second review, L1).
# Version 6.26.0 builds the unique index of a unique step of a field in its index migration at expand, quotes the
# migration names of a ledger refusal, and stops the job with a refusal that names the migration, the index and the
# table, and no row value, when two rows hold one value of a new unique key (ST-SUP-RC01-OC38, ST-SUP-RC01-OC51;
# ST-GEN-Q48; security review of PR #476, I1).
# Version 6.27.0 gives the refusal of a changed migration body and of a contract step that waits a fault class, the
# table that tells it, a fixed remedy and the cause class refused, so the failure record of the migration job names
# them with no change or row (ST-SUP-RC01-OC50, ST-SUP-RC01-OC51; walkthrough 21, U-F).
kind: component
name: postgres-adapter
# Version 6.29.0 gives a refused unique step and a refused foreign key step the fault class
# schema_change.unique_duplicates or schema_change.foreign_key_broken, the index or the key as the object, and a
# fixed remedy (ST-SUP-RC01-OC38, ST-SUP-RC01-OC46; walkthrough 23, D-f).
# Version 6.31.0 builds the schema change kind relate: its expand step makes the checkpoint of the relate job and
# changes no table, and relate_changes.go gives the relate job each row with its subject (ST-SUP-RC01-OC52, decision
# ST-SUP-Q212 (a); walkthrough 24, P2-R2).
version: 6.31.0
stage: ga
output_namespace: internal/storage

config:
  schema_generation:
    type: string
  writer_lease:
    type: string
  migrations:
    type: string
    default: startup
    enum: [startup, external]
  connection_string:
    type: string
    secret: true

requires: []

provides:
  - storage-adapter

slots: []

# The conversions of a retype (ST-DECL-INV62, ST-DECL-INV63). A partial conversion is total only under one of its
# total_when limits on the field before the change; else the retype needs a fill value.
conversions:
  - {name: integer_to_int64, from: int32, to: int64, total: true}
  - {name: int64_to_integer, from: int64, to: int32, total: false, total_when: [{min: -2147483648, max: 2147483647}]}
  - {name: integer_to_text, from: int32, to: string, total: true}
  - {name: int64_to_text, from: int64, to: string, total: true}
  - {name: bool_to_text, from: bool, to: string, total: true}
  - {name: text_to_integer, from: string, to: int32, total: false, total_when: [{pattern: "^[0-9]{1,9}$"}, {pattern: "^-?[0-9]{1,9}$"}]}
  - {name: text_to_int64, from: string, to: int64, total: false, total_when: [{pattern: "^[0-9]{1,9}$"}, {pattern: "^-?[0-9]{1,9}$"}, {pattern: "^[0-9]{1,18}$"}, {pattern: "^-?[0-9]{1,18}$"}]}
  - {name: text_to_bool, from: string, to: bool, total: false, total_when: [{pattern: "^(true|false)$"}]}

# The architecture role (ST-SUP-EN09 field Architecture role, ST-SUP-UC01-R05): the layer, the part in a request
# flow, and the side of each port. The architecture model places the component from it alone.
architecture:
  layer: repository
  flow: "Reads and writes the rows of each entity in PostgreSQL in one transaction."
  store: PostgreSQL
  ports:
    storage-adapter: inbound

environment:
  - name: STEGO_LOG_LEVEL
    type: string
    required: false
    default: "info"
    description: "The lowest severity of the log lines on standard output and standard error: debug, info, warn or error. When it has no value, the level is info."
    secret: false
    example: "warn"
    allowed: {values: ["debug", "info", "warn", "error"]}
  - name: DATABASE_URL
    type: string
    required: false
    description: "The PostgreSQL connection string of the runtime role, or DATABASE_URL_FILE in its place, not the two. The process does not start when the two have no value."
    secret: true
    one_of: database-url
    secret_source: {name: "{service}-database", key: url}
  - name: DATABASE_URL_FILE
    type: path
    required: false
    description: "The file that holds the PostgreSQL connection string of the runtime role. Give it or DATABASE_URL, not the two."
    secret: false
    one_of: database-url
    example: "/etc/stego/database/url"
  - name: STEGO_MIGRATION_DATABASE_URL
    type: string
    required: false
    description: "The PostgreSQL connection string of the migration job, or STEGO_MIGRATION_DATABASE_URL_FILE in its place, not the two. The process does not start when the two have no value."
    secret: true
    one_of: migration-database-url
    secret_source: {name: "{service}-database-owner", key: url}
    read_by_mode: migrate
  - name: STEGO_MIGRATION_DATABASE_URL_FILE
    type: path
    required: false
    description: "The file that holds the PostgreSQL connection string of the migration job. Give it or STEGO_MIGRATION_DATABASE_URL, not the two."
    secret: false
    one_of: migration-database-url
    read_by_mode: migrate
    example: "/etc/stego/database-owner/url"
  - name: STEGO_WORKER_DATABASE_URL
    read_by_mode: worker
    type: string
    required: false
    description: "The PostgreSQL connection string of the worker role, or STEGO_WORKER_DATABASE_URL_FILE in its place, not the two. The process does not start when the two have no value."
    secret: true
    one_of: worker-database-url
    read_with: service
    secret_source: {name: "{service}-database", key: worker-url}
  - name: STEGO_WORKER_DATABASE_URL_FILE
    read_by_mode: worker
    type: path
    required: false
    description: "The file that holds the PostgreSQL connection string of the worker role. Give it or STEGO_WORKER_DATABASE_URL, not the two."
    secret: false
    one_of: worker-database-url
    read_with: service
    example: "/etc/stego/database/worker-url"
  - name: STEGO_RELAY_DATABASE_URL
    read_by_mode: worker
    type: string
    required: false
    description: "The PostgreSQL connection string of the relay role, or STEGO_RELAY_DATABASE_URL_FILE in its place, not the two. The process does not start when the two have no value."
    secret: true
    one_of: relay-database-url
    read_with: service
    secret_source: {name: "{service}-database-relay", key: url}
  - name: STEGO_RELAY_DATABASE_URL_FILE
    read_by_mode: worker
    type: path
    required: false
    description: "The file that holds the PostgreSQL connection string of the relay role. Give it or STEGO_RELAY_DATABASE_URL, not the two."
    secret: false
    one_of: relay-database-url
    read_with: service
    example: "/etc/stego/database/relay-url"
  - name: STEGO_DATABASE_MAX_OPEN_CONNECTIONS
    type: integer
    required: false
    default: "16"
    description: "The largest number of open connections in the database pool. When it has no value, the pool opens at most 16 connections."
    secret: false
    example: "32"
    allowed: {min: "1", max: "1024"}
  - name: STEGO_DATABASE_MAX_IDLE_CONNECTIONS
    type: integer
    required: false
    description: "The largest number of idle connections in the database pool, at most the open limit. When it has no value, the limit is 4, or the open limit when it is less."
    secret: false
    example: "8"
    allowed: {min: "0", max: "1024"}
  - name: STEGO_DATABASE_CONNECTION_MAX_LIFETIME
    type: duration
    required: false
    default: "30m"
    description: "The longest time that the pool keeps one database connection. When it has no value, the limit is 30 minutes."
    secret: false
    example: "1h"
    allowed: {min: "1s", max: "24h"}
  - name: STEGO_DATABASE_CONNECTION_MAX_IDLE_TIME
    type: duration
    required: false
    default: "5m"
    description: "The longest time that the pool keeps an idle database connection. When it has no value, the limit is 5 minutes."
    secret: false
    example: "10m"
    allowed: {min: "1s", max: "24h"}
  - name: STEGO_DATABASE_ALLOW_INSECURE_LOOPBACK
    type: boolean
    required: false
    default: "0"
    description: "Set to 1 to let a loopback database connection go without TLS, for a local test only. When it has no value, each connection needs TLS."
    secret: false
    allowed: {values: ["0", "1"]}
  - name: HOME
    type: path
    required: false
    description: "Read by the pgx driver for its default pass, service and certificate files. The database opener gives each of those settings itself, so no file under HOME changes the connection."
    secret: false
  - name: PGAPPNAME
    type: string
    required: false
    description: "Read by the pgx driver for a part that the connection string does not give. The service does not start when it has a value: give the part in DATABASE_URL."
    secret: false
  - name: PGCHANNELBINDING
    type: string
    required: false
    description: "Read by the pgx driver for a part that the connection string does not give. The service does not start when it has a value: give the part in DATABASE_URL."
    secret: false
  - name: PGCONNECT_TIMEOUT
    type: string
    required: false
    description: "Read by the pgx driver for a part that the connection string does not give. The service does not start when it has a value: give the part in DATABASE_URL."
