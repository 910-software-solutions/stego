# The Kubernetes base of the service. stego apply writes this file from the declaration and the platform
# requirements, with no value that differs per environment: the platform's overlay supplies them. Do not edit it.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: user-management
  name: user-management
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: user-management
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user-management
    spec:
      automountServiceAccountToken: false
      containers:
        - image: user-management
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
          name: user-management
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          resources:
            limits:
              cpu: "1"
              ephemeral-storage: 128Mi
              memory: 512Mi
            requests:
              cpu: 100m
              ephemeral-storage: 32Mi
              memory: 128Mi
      serviceAccountName: user-management
