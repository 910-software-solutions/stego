kind: component
name: controller
version: 1.26.0
stage: ga
output_namespace: controller
requires: []
provides:
  - reconciliation-runtime
slots: []

# The architecture role (ST-SUP-EN09 field Architecture role, ST-SUP-UC01-R05): the layer, the part in a request
# flow, and the side of each port. The architecture model places the component from it alone.
architecture:
  layer: handler
  flow: "Reconciles each declared resource toward the state that its spec asks for."
  ports:
    reconciliation-runtime: inbound

environment:
  - name: STEGO_CONTROLLER_MONITOR_ADDR
    type: address
    required: false
    default: "127.0.0.1:9081"
    description: "The loopback address of the health and metrics monitor of the controller. When it has no value, the monitor listens on 127.0.0.1:9081."
    secret: false
    example: "127.0.0.1:9181"
