kind: component
name: cli-application
# Version 1.9.0 gives the apply lookup the list parameters of the generated service, pageSize and search, and follows
# the next cursor of each page; before, it sent page and size, which the list refuses, and read total, which the list
# does not give (security review of PR #442, I5).
version: 1.9.0
stage: ga
output_namespace: cli
config:
  factory_package:
    type: string
requires: []
provides:
  - application-cli
slots: []

# The architecture role (ST-SUP-EN09 field Architecture role, ST-SUP-UC01-R05): the layer, the part in a request
# flow, and the side of each port. The architecture model places the component from it alone.
architecture:
  layer: edge
  flow: "Gives an operator a command-line client that calls the service."
  ports:
    application-cli: inbound

environment:
  - name: APPLY_CONFIG
    type: path
    required: false
    description: "The file of the configuration of the apply command. When it has no value, the CLI uses apply/config.json in the configuration folder of the user."
    secret: false
    example: "/home/user/.config/apply/config.json"
