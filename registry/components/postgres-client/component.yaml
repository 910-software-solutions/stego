kind: component
name: postgres-client
version: 1.5.1
stage: ga
output_namespace: postgres
requires: []
provides:
  - postgres-reads
  - postgres-databases
slots: []

# The architecture role (ST-SUP-EN09 field Architecture role, ST-SUP-UC01-R05): the layer, the part in a request
# flow, and the side of each port. The architecture model places the component from it alone.
architecture:
  layer: store
  flow: "Opens the PostgreSQL databases of the service and runs its reads."
  ports:
    postgres-reads: inbound
    postgres-databases: inbound
