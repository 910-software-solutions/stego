kind: component
name: otel-tracing
version: 1.19.0
stage: ga
output_namespace: tracing

config: {}

requires: []

provides:
  - tracing

slots: []

# The architecture role (ST-SUP-EN09 field Architecture role, ST-SUP-UC01-R05): the layer, the part in a request
# flow, and the side of each port. The architecture model places the component from it alone.
architecture:
  layer: outside call
  flow: "Exports a trace span of each request to the OpenTelemetry collector."
  ports:
    tracing: inbound
