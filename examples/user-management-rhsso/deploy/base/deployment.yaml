# The Kubernetes base of the service. stego apply writes this file from the declaration and the platform
# requirements, with no value that differs per environment: the platform's overlay supplies them, and every
# overlay must set the image by digest, because the image of the base is a name that no registry serves. Do not
# edit it.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: user-management
  name: user-management
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: user-management
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user-management
    spec:
      automountServiceAccountToken: false
      containers:
        - image: stego.invalid/user-management:set-by-overlay
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
          name: user-management
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          resources:
            limits:
              cpu: "1"
              ephemeral-storage: 128Mi
              memory: 512Mi
            requests:
              cpu: 100m
              ephemeral-storage: 32Mi
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: user-management
      volumes:
        - emptyDir:
            sizeLimit: 64Mi
          name: tmp
