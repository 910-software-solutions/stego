kind: component
name: keycloak-provider
version: 0.19.0
stage: ga
output_namespace: keycloak
config:
  managed_clients:
    type: list
    optional: true
    items:
      kind: {type: string}
      client_id: {type: string}
      ids:
        type: list
        items: {type: string}
      attributes:
        type: list
        items:
          key: {type: string}
          value: {type: string}
      legacy: {type: bool, optional: true}
      legacy_client_id: {type: bool, optional: true}
requires:
  - application-http
  - auth-provider
provides:
  - keycloak-clients
slots: []

# The architecture role (ST-SUP-EN09 field Architecture role, ST-SUP-UC01-R05): the layer, the part in a request
# flow, and the side of each port. The architecture model places the component from it alone.
architecture:
  layer: outside call
  flow: "Manages the Keycloak clients of the service."
  ports:
    application-http: outbound
    auth-provider: outbound
    keycloak-clients: inbound

environment: []
