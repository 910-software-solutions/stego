kind: component
name: http-application
# Version 2.1.0: the common HTTPS client gives ErrTransport for a request that failed in transport or stopped
# before the end of its answer, and ErrDeadline for a request whose time limit ended (security review of PR #447, I-2).
# Version 2.2.0: the common HTTPS client gives ErrUntrusted, not ErrTransport, for a certificate of the service that
# the TLS handshake refuses, so the CLI does not send a write again after it (security review of PR #449, INFO-3).
version: 2.2.0
stage: ga
output_namespace: application
config:
  factory_package:
    type: string
  document:
    type: string
  references:
    type: list
    items:
      type: string
  response_mappings:
    type: list
    items:
      name:
        type: string
      provider:
        type: string
      model:
        type: string
      schema:
        type: string
      inputs:
        type: list
        optional: true
        items:
          name:
            type: string
          type:
            type: string
          optional:
            type: bool
            optional: true
      fields:
        type: list
        items:
          target:
            type: string
          source:
            type: string
            optional: true
          input:
            type: string
            optional: true
          constant:
            type: string
            optional: true
          prefix:
            type: string
            optional: true
          conversion:
            type: string
            optional: true
          max_bytes:
            type: int
            optional: true
          max_items:
            type: int
            optional: true
          max_item_bytes:
            type: int
            optional: true
          max_nodes:
            type: int
            optional: true
          max_depth:
            type: int
            optional: true
          max_scalar_bytes:
            type: int
            optional: true
          on_empty:
            type: string
            optional: true
          omit:
            type: bool
            optional: true
          omit_empty:
            type: bool
            optional: true
          on_absent:
            type: string
            optional: true
requires:
  - storage-adapter
  - auth-provider
provides:
  - application-http
slots: []

# The architecture role (ST-SUP-EN09 field Architecture role, ST-SUP-UC01-R05): the layer, the part in a request
# flow, and the side of each port. The architecture model places the component from it alone.
architecture:
  layer: edge
  flow: "Receives each HTTP request of the application and passes it to its handler."
  ports:
    storage-adapter: outbound
    auth-provider: outbound
    application-http: inbound

environment: []
