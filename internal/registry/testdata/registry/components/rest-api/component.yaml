kind: component
environment: []
name: rest-api
version: 3.0.0
stage: ga
output_namespace: internal/api

config:
  expose:
    type: list
    items:
      entity:
        type: entity-ref
      operations:
        type: list
        items:
          enum: [create, read, update, delete, list, upsert, patch]
      scope:
        type: field-ref
        optional: true
      parent:
        type: entity-ref
        optional: true
      path_prefix:
        type: string
        optional: true
      upsert_key:
        type: list
        items:
          type: field-ref
        optional: true
      concurrency:
        type: string
        enum: [optimistic]
        optional: true

requires:
  - auth-provider
  - storage-adapter

provides:
  - http-server
  - openapi-spec

slots:
  - name: before_create
    phase: before_store
    operations: [create]
    proto: stego.components.rest_api.slots.BeforeCreate
    default: passthrough
  - name: before_upsert
    phase: before_store
    operations: [create]
    proto: stego.components.rest_api.slots.BeforeUpsert
    default: passthrough
  - name: before_patch
    phase: before_store
    operations: [create]
    proto: stego.components.rest_api.slots.BeforePatch
    default: passthrough
  - name: before_delete
    phase: before_store
    operations: [create]
    proto: stego.components.rest_api.slots.BeforeDelete
    default: passthrough
  - name: after_create
    phase: before_store
    operations: [create]
    proto: stego.components.rest_api.slots.AfterCreate
    default: passthrough
  - name: after_upsert
    phase: before_store
    operations: [create]
    proto: stego.components.rest_api.slots.AfterUpsert
    default: passthrough
  - name: after_patch
    phase: before_store
    operations: [create]
    proto: stego.components.rest_api.slots.AfterPatch
    default: passthrough
  - name: after_delete
    phase: before_store
    operations: [create]
    proto: stego.components.rest_api.slots.AfterDelete
    default: passthrough
  - name: validate
    phase: before_store
    operations: [create]
    proto: stego.components.rest_api.slots.Validate
    default: passthrough
architecture:
  layer: handler
  flow: Serves the test.
  ports:
    auth-provider: outbound
    storage-adapter: outbound
    http-server: inbound
    openapi-spec: inbound
