kind: component
name: rh-sso-auth
version: 2.1.0
stage: ga
output_namespace: internal/auth

config:
  issuer:
    type: string
  audience:
    type: string
  jwk_ca_file:
    type: string
    optional: true
  jwk_cert_url:
    type: string
    default: "https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/certs"
  jwk_cert_file:
    type: string
    optional: true
  public_paths:
    type: list
    items:
      type: string
    default: ["/healthcheck", "/metrics"]

requires: []

provides:
  - auth-provider

slots: []

# The architecture role (ST-SUP-EN09 field Architecture role, ST-SUP-UC01-R05): the layer, the part in a request
# flow, and the side of each port. The architecture model places the component from it alone.
architecture:
  layer: authentication
  flow: "Checks the Red Hat SSO token of the request and puts the caller's identity on it."
  ports:
    auth-provider: inbound
