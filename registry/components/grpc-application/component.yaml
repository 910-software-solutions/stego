# Version 2.1.0 authenticates each call through the service runtime, which refuses a tenant that the tenant list does
# not hold as active with PERMISSION_DENIED and the code tenant.not_provisioned (ST-SUP-RC27-OC11).
kind: component
name: grpc-application
version: 2.1.0
stage: ga
output_namespace: grpcapi
config:
  proto_files:
    type: list
    items:
      path:
        type: string
      import_path:
        type: string
      reference:
        type: string
        optional: true
requires:
  - storage-adapter
  - auth-provider
provides:
  - application-grpc
slots: []
