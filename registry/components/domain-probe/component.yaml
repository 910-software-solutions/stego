kind: component
name: domain-probe
version: 1.0.1
stage: ga
output_namespace: probes

config: {}

requires: []

provides:
  - domain-probes

slots: []

# The architecture role (ST-SUP-EN09 field Architecture role, ST-SUP-UC01-R05): the layer, the part in a request
# flow, and the side of each port. The architecture model places the component from it alone.
architecture:
  layer: handler
  flow: "Runs the declared domain probes and reports what they observe."
  ports:
    domain-probes: inbound
