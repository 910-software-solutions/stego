# Version 1.21.0: the browser relay refuses traces when the deployment ratio is 0 and drops each span that the
# TraceIdRatio rule of the browser runtime does not sample at that ratio (security review of PR #494, L1).
kind: component
name: otel-tracing
# Version 1.22.0 writes each local JSON line in the one form of the lines of the runtime: the timestamp in UTC, the
# service name, the event name and the message, and the fields under attributes (http.*, rpc.*, error.type and stego.*);
# and closes the windows of the access lines at a tick, so the count line of a window comes at its end also when no
# later request of its route and status comes (walkthrough 25, L-1, L-2; ST-SUP-RC17-OC20, ST-SUP-RC17-OC23).
# Version 1.23.0: at the ratio 1 the browser relay keeps each span, as the TraceIdRatioBasedSampler of the browser
# runtime samples each trace ID there (security review of PR #495, I2; ST-SUP-RC17-OC15). Its runtime gives its
# instance identity (Instance), which the runtime of the service takes, so each line of one process names one
# instance (core49 follow-up; ST-SUP-RP03-LC16).
version: 1.23.0
stage: ga
output_namespace: tracing

config: {}

requires: []

provides:
  - tracing

slots: []

# The architecture role (ST-SUP-EN09 field Architecture role, ST-SUP-UC01-R05): the layer, the part in a request
# flow, and the side of each port. The architecture model places the component from it alone.
architecture:
  layer: outside call
  flow: "Exports a trace span of each request to the OpenTelemetry collector."
  ports:
    tracing: inbound

environment:
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    type: url
    required: false
    description: "The HTTPS origin of the OpenTelemetry collector. When it has no value, the service exports no telemetry."
    secret: false
    example: "https://collector.example.com:4317"
  - name: OTEL_EXPORTER_OTLP_PROTOCOL
    type: string
    required: false
    default: "grpc"
    description: "The OTLP protocol of the export, which can only be grpc. When it has no value, the export uses grpc."
    secret: false
    allowed: {values: ["grpc"]}
  - name: OTEL_EXPORTER_OTLP_CERTIFICATE
    type: path
    required: false
    description: "A PEM file of certificate authorities that verify the collector. When it has no value, the export uses the system roots."
    secret: false
    example: "/etc/stego/otel/ca.crt"
  - name: OTEL_SERVICE_NAME
    type: string
    required: false
    description: "The service name in the telemetry. When it has no value, the telemetry uses the declared service name."
    secret: false
    example: "orders-api"
  - name: OTEL_TRACES_SAMPLER_ARG
    type: number
    required: false
    default: "0.1"
    description: "The ratio of traces that the service samples. When it has no value, the ratio is 0.1."
    secret: false
    example: "0.5"
    allowed: {min: "0", max: "1"}
  - name: OTEL_METRICS_EXPORTER
    type: string
    required: false
    default: "otlp"
    description: "Set to none to stop the export of metrics. When it has no value, the service exports metrics with OTLP."
    secret: false
    allowed: {values: ["otlp", "none"]}
  - name: OTEL_LOGS_EXPORTER
    type: string
    required: false
    default: "otlp"
    description: "Set to none to stop the export of logs. When it has no value, the service exports logs with OTLP."
    secret: false
    allowed: {values: ["otlp", "none"]}
  - name: OTEL_METRIC_EXPORT_INTERVAL
    type: integer
    required: false
    default: "10000"
    description: "The time between two exports of metrics, in milliseconds. When it has no value, the time is 10000 milliseconds."
    secret: false
    example: "30000"
    allowed: {min: "1000", max: "60000", unit: milliseconds}
  - name: STEGO_OTEL_TOKEN_FILE
    type: path
    required: false
    description: "The file of the bearer token for the collector at OTEL_EXPORTER_OTLP_ENDPOINT. When it has no value, the export sends no token."
    secret: false
    example: "/etc/stego/otel/token"
  - name: STEGO_LOG_LEVEL
    type: string
    required: false
    default: "info"
    description: "The lowest severity of the log lines on standard output and standard error: debug, info, warn or error. When it has no value, the level is info."
    secret: false
    example: "warn"
    allowed: {values: ["debug", "info", "warn", "error"]}
  - name: GRPC_ALTS_MAX_CONCURRENT_HANDSHAKES
    type: string
    required: false
    description: "Read by the gRPC library. The service does not start when it has a value, because it can change how gRPC connects or what it logs."
    secret: false
