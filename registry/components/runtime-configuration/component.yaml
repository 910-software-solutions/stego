kind: component
name: runtime-configuration
version: 2.0.0
stage: ga
output_namespace: configuration
config:
  groups:
    type: list
    items:
      name:
        type: string
      fields:
        type: list
        items:
          name:
            type: string
          env:
            type: string
          type:
            type: string
          default:
            type: string
            optional: true
          min:
            type: string
            optional: true
          max:
            type: string
            optional: true
          min_length:
            type: int
            optional: true
          max_length:
            type: int
            optional: true
          description:
            type: string
          required:
            type: bool
          secret:
            type: bool
            optional: true
requires: []
provides:
  - typed-runtime-configuration
slots: []

# The architecture role (ST-SUP-EN09 field Architecture role, ST-SUP-UC01-R05): the layer, the part in a request
# flow, and the side of each port. The architecture model places the component from it alone.
architecture:
  layer: handler
  flow: "Reads the typed runtime configuration that the service starts with."
  ports:
    typed-runtime-configuration: inbound

environment: []
