# Version 4.12.0 takes a secret field in a request and gives it in no response, marks it writeOnly in the OpenAPI
# document, and keeps the stored secret when a write leaves it out (ST-SUP-RC20-OC48, decision ST-DECL-Q44).
# The rest-api component serves each declared collection on the runtime data path, the one data path
# (ST-SUP-RC20-OC39): each collection operation is one generated command or query of the command and query
# components, which a service with collections must therefore have. Version 4.0.0 removed the handlers of the store
# path and their storage interface. Version 4.2.0 stages the change event of each write when the service has the
# kafka-producer component (ST-SUP-RC20-OC40). Version 4.2.1 lists each failed member of a body in a 400 validation
# problem, not only the first (ST-SUP-RC20-OC05). Version 4.2.2 lists at most 50 of them and one entry that counts
# the rest, and no entry quotes a value of the request. Version 4.2.3 refuses a body of more than 10000 JSON values
# and member names before the schema check (ST-SUP-RC20-OC21). Version 4.2.4 reads each number of the count as text
# and refuses a body that is not JSON, so no error of the count lets a body pass. Version 4.3.0 makes a list that
# names the caller's write in Authz-Revocation-After wait for it before it reads (ST-SUP-RC20-OC41). Version 4.4.0
# makes a read wait the same way (ST-SUP-RC20-OC42), and its OpenAPI document describes the revocation headers and
# the revocation status route (ST-SUP-RC20-OC43). Version 4.4.1 lists the state expired of a revocation in its OpenAPI
# document (ST-SUP-RC20-OC43). Version 4.8.0 refuses with a 400 validation problem a create, an update or an upsert of
# a scoped collection whose body names another parent in the scope field than the path (walkthrough 8, step 30).
# Version 4.11.0 makes each write that names the caller's revocation in Authz-Revocation-After wait for it before
# it decides (ST-SUP-RC20-OC49), and answers a unique violation of a declared key with 409 that names the fields of
# the key (ST-SUP-RC20-OC50) (walkthrough 12, W12-B1 and W12-B11).
# Version 4.13.0 keeps each field with writable create or never: an update, an upsert and a patch refuse another
# value with a 400 validation problem that names the field, and refuse any member of a secret such field with no
# compare; a create stores the default of a never field; and the OpenAPI document marks such a field readOnly in the
# entity schema and gives the update its own request schema (ST-SUP-RC20-OC44 to ST-SUP-RC20-OC47).
# Version 4.14.0 leaves a cleared required secret out of each answer, where it gave an empty value (ST-SUP-RC20-OC48,
# walkthrough 13, W13-B7), and a list refuses with 400 a query parameter that it does not read, such as limit, and names
# it (ST-SUP-RC20-OC51).
# Version 4.15.0 parses the query string of a list once and refuses with 400 one that does not parse, such as one with
# a ';', a bad escape or more than 10000 parameters; cuts a refused name on a character boundary and names it once; and
# sets X-Content-Type-Options: nosniff on each problem answer (security review of PR #442, L1 and I3).
# Version 4.15.1 cuts a refused parameter name at 64 bytes when it has no character boundary in its first 64 bytes,
# where it gave an empty name (security review of PR #445, I-4).
# Version 4.17.0 describes each command and each get or list query in the OpenAPI document, at its route, and the
# request validation does not check the body of a command (ST-SUP-RC20-OC53).
# Version 4.18.0 skips the check of a body only for an operation whose x-stego-command marker is true (security review
# of PR #454, INFO).
# Version 4.19.0 lets an update leave out a secret field, or give it empty, and keep the stored value: the update
# request requires no secret and holds no min_length or pattern of one (ST-SUP-RC20-OC48; walkthrough 14, W14-B4).
# It refuses at checking a field named kind or href of an entity that a collection serves (ST-SUP-RC20-OC52).
# Version 4.20.0 calls the update of the runtime in the generated writes of an entity with its own resource type,
# whose repository type takes no parent on Update (ST-SUP-RC32-OC26).
# Version 4.21.0 lets a list search and order a field written sensitivity: public, as one with no sensitivity
# (decision ST-DECL-Q46 (a)).
# Version 4.22.0 marks a member of a command message that the proto marks debug_redact as a secret in the OpenAPI
# document: x-sensitive, the format password for a string, and writeOnly in a request body (ST-SUP-RC20-OC54,
# ST-SUP-Q192).
# Version 4.23.0 marks the root of a command response x-sensitive when the message holds such a member at any depth,
# also deeper than the schema follows, and refuses a path parameter that is such a member (security review of
# PR #460, L1 and L2).
# Version 4.24.0 refuses each member of a patch body that is not kind, a patchable field or a field that a collection
# write cannot change, in its exact letter case, with a 400 validation problem that names the member, and closes the
# patch request of the OpenAPI document with additionalProperties: false (ST-SUP-RC20-OC15, security review of PR
# #461, M1).
# Version 4.25.0 puts Idempotency-Kept: 1 on each answer to a create or a patch with a key when the service has the
# idempotency component, and describes the header on each response of such a create and patch and of each command
# (ST-SUP-RC30-OC08, ST-SUP-RC32-OC27, ST-SUP-Q193 (a)).
# Version 4.26.0 marks the root of a command response x-stego-opaque when the message holds a google.protobuf.Any,
# Struct, Value or ListValue member at any depth; the mark asks no key ring (ST-SUP-RC20-OC54, ST-SUP-Q194 (a)).
# Version 4.27.0 refuses each member of a create, an update or an upsert body that is not kind, id, href or a field of
# the entity, in its exact letter case, with a 400 validation problem that names the member; refuses an implicit field
# with another value than that of the collection; and closes the create-request and update-request schemas of the
# OpenAPI document with additionalProperties: false, with the members that the server sets marked x-output-only and the
# members that a body may only repeat marked x-kept (ST-SUP-RC20-OC55, ST-SUP-RC20-OC20, ST-SUP-RC20-OC23,
# ST-SUP-RC20-OC35, ST-SUP-RC20-OC47, decision ST-SUP-Q195).
# Version 4.28.0 gives the Idempotency-Key header parameter, not required, and the 422 response on each create and
# patch of the OpenAPI document when the idempotency component is not active, since the handler keeps the key that a
# request gives (ST-SUP-RC20-OC56).
# Version 4.31.0 does not require, in the create-request schema, a field with a declared default, which a create that
# leaves it out stores (ST-SUP-RC20-OC47; walkthrough 18, step 38), and answers a create or a patch whose
# Idempotency-Key header is not one structured string of 1 to 255 characters with the problem type
# idempotency-key-invalid, which the OpenAPI document gives on the 400 answer with idempotency-key-missing
# (ST-SUP-RC30-OC02, decision ST-SUP-Q202 (a)).
# Version 4.32.0 stages the declared event fields of an entity in the change event of each collection write, as a
# command does (ST-SUP-RC20-OC40, ST-SUP-RC32-OC25, decision ST-SUP-Q184 (c)).
# Version 4.33.0 gives the problem types of the Idempotency-Key, under the problem base, to the refusals of a create
# and a patch also when the idempotency component is not active, as a command does: a malformed key gets
# idempotency-key-invalid, not about:blank (ST-SUP-RC20-OC56; walkthrough 19, W19-U3).
# Version 4.34.0 reads the Idempotency-Key header of a create and a patch before the body, in the request check and
# in the handler, as a command does: a malformed key gets idempotency-key-invalid, and an absent required key
# idempotency-key-missing, also when the body is not valid (ST-SUP-RC30-OC02, decision ST-SUP-Q202 (a); walkthrough
# 19, W19-U3).
# Version 4.35.0 writes the entity code of command 1.25.0: the counter of a field with attempts holds its declared
# unlock_after (ST-SUP-RC32-OC24, decision ST-SUP-Q205 (c)).
kind: component
name: rest-api
# Version 4.36.0 waits for the revocation of Authz-Revocation-After of a write through AwaitRevocationOn with the
# response writer, so a wait that Prefer: wait=N asked for answers Preference-Applied (ST-SUP-RC20-OC49,
# ST-SUP-RP10-LC47; walkthrough 23).
# Version 4.38.0 answers a 503 of a database that cannot serve now with a detail that names the database, and a 503 of
# an undecided permission with one that names the authorization provider (ST-SUP-RC20-OC37; walkthrough 24).
# Version 4.39.0 gives a problem that the status sets at run time the slug of its status: service-unavailable for a
# 503, such as of a database that cannot serve now, method-not-allowed, content-too-large and unprocessable-content
# (walkthrough 25, P1-16; ST-SUP-RC20-OC04).
version: 4.41.0
stage: ga
output_namespace: internal/api

config:
  expose:
    type: list
    items:
      entity:
        type: entity-ref
      operations:
        type: list
        items:
          enum: [create, read, update, delete, list, upsert, patch]
      scope:
        type: field-ref
        optional: true
      parent:
        type: entity-ref
        optional: true
      path_prefix:
        type: string
        optional: true
      upsert_key:
        type: list
        items:
          type: field-ref
        optional: true
      concurrency:
        type: string
        enum: [optimistic]
        optional: true

requires:
  - auth-provider
  - storage-adapter

provides:
  - http-server
  - openapi-spec

slots:
  - name: before_create
    phase: before_store
    operations: [create]
    proto: stego.components.rest_api.slots.BeforeCreate
    default: passthrough
  # before_upsert and after_upsert are declared, and a binding of them is refused: only the removed store path
  # called them (ST-SUP-RC20-OC39). An upsert calls validate and on_entity_changed.
  - name: before_upsert
    phase: before_store
    operations: [upsert]
    proto: stego.components.rest_api.slots.BeforeUpsert
    default: passthrough
  - name: before_patch
    phase: before_store
    operations: [patch]
    proto: stego.components.rest_api.slots.BeforePatch
    default: passthrough
  - name: before_delete
    phase: before_store
    operations: [delete]
    proto: stego.components.rest_api.slots.BeforeDelete
    default: passthrough
  - name: after_create
    phase: after_store
    operations: [create]
    proto: stego.components.rest_api.slots.AfterCreate
    default: passthrough
  - name: after_upsert
    phase: after_store
    operations: [upsert]
    proto: stego.components.rest_api.slots.AfterUpsert
    default: passthrough
  - name: after_patch
    phase: after_store
    operations: [patch]
    proto: stego.components.rest_api.slots.AfterPatch
    default: passthrough
  - name: after_delete
    phase: after_store
    operations: [delete]
    proto: stego.components.rest_api.slots.AfterDelete
    default: passthrough
  - name: validate
    phase: before_store
    operations: [create, update, upsert]
    proto: stego.components.rest_api.slots.Validate
    default: passthrough

# The architecture role (ST-SUP-EN09 field Architecture role, ST-SUP-UC01-R05): the layer, the part in a request
# flow, and the side of each port. The architecture model places the component from it alone.
architecture:
  layer: handler
  flow: "Decodes the request of a collection operation and calls its command or query."
  serves: [collection operations]
  ports:
    auth-provider: outbound
    storage-adapter: outbound
    http-server: inbound
    openapi-spec: inbound

environment:
  - name: CORS_ALLOWED_ORIGINS
    type: list
    required: false
    description: "The origins that may send cross-origin requests. When it has no value, the API sets no CORS header."
    secret: false
    read_by_mode: api
    example: "https://app.example.com,https://admin.example.com"
  - name: CORS_ALLOWED_METHODS
    type: list
    required: false
    default: "GET,POST,PATCH,PUT,DELETE,OPTIONS"
    description: "The HTTP methods that cross-origin requests may use. When it has no value, the API allows GET, POST, PATCH, PUT, DELETE and OPTIONS."
    secret: false
    read_by_mode: api
    example: "GET,POST"
  - name: CORS_ALLOWED_HEADERS
    type: list
    required: false
    default: "Content-Type,Authorization"
    description: "The request headers that cross-origin requests may send. When it has no value, the API allows Content-Type and Authorization."
    secret: false
    read_by_mode: api
    example: "Content-Type,Authorization,X-Request-Id"
