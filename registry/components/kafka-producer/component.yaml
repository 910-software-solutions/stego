# kafka-producer emits no code since 3.0.0: the Kafka destination of the runtime outbox publishes each change event
# (ST-SUP-RP01-LC30 to ST-SUP-RP01-LC32). The outbox registers that destination on its worker (ST-SUP-RC18-OC31),
# and each generated write of a collection stages its change event in the transaction of its command
# (ST-SUP-RC20-OC40). The settings are the STEGO_KAFKA_ settings of the worker mode.
kind: component
name: kafka-producer
version: 3.0.0
stage: ga
output_namespace: internal/events

config: {}
requires:
  - durable-outbox
provides:
  - event-publisher
slots: []

# The architecture role (ST-SUP-EN09 field Architecture role, ST-SUP-UC01-R05): the layer, the part in a request
# flow, and the side of each port. The architecture model places the component from it alone.
architecture:
  layer: outside call
  flow: "Publishes each change message of the outbox to Kafka."
  ports:
    durable-outbox: outbound
    event-publisher: inbound
