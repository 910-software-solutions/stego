# Version 1.2.3 takes the boolean OpenAPI marks x-kept and x-stego-opaque of the rest-api document (security
# review of PR #463, F1).
# Version 1.2.4 takes a document whose request schemas mark a member x-output-only, as the rest-api component writes a
# create or an update request (ST-SUP-RC20-OC55, decision ST-SUP-Q195).
# Version 1.3.0 makes the client of the service's own API when the declaration gives no document, which the mixin
# typescript-sdk selects (ST-SUP-RC24-OC14); takes the header parameters that the browser backend forwards from the
# input of an operation (ST-SUP-RC24-OC15); and checks the string formats uuid, byte and int64 of the service document.
# Version 1.4.0 reads the code of an error answer of the media type application/problem+json too, as a command
# refusal gives it, and takes an error code with a dot in error_codes, such as the refusal code shipment.not_draft
# (ST-SUP-RC24-OC09; walkthrough 20, P-A).
kind: component
name: typescript-sdk
version: 1.4.0
stage: ga
output_namespace: tssdk
config:
  document:
    type: string
  references:
    type: list
    items:
      type: string
  error_codes:
    type: list
    items:
      type: string
requires: []
provides:
  - application-typescript-sdk
slots: []

# The architecture role (ST-SUP-EN09 field Architecture role, ST-SUP-UC01-R05): the layer, the part in a request
# flow, and the side of each port. The architecture model places the component from it alone.
architecture:
  layer: edge
  flow: "Gives callers a typed TypeScript client of the service's API."
  ports:
    application-typescript-sdk: inbound

environment: []
