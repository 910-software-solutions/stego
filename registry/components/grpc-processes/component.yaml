kind: component
name: grpc-processes
version: 1.5.0
stage: ga
output_namespace: grpcapi
config:
  response_mappings:
    type: list
    items:
      name:
        type: string
      provider:
        type: string
      model:
        type: string
      message:
        type: string
      inputs:
        type: list
        optional: true
        items:
          name:
            type: string
          type:
            type: string
          optional:
            type: bool
            optional: true
      fields:
        type: list
        items:
          target:
            type: string
          source:
            type: string
            optional: true
          input:
            type: string
            optional: true
          constant:
            type: string
            optional: true
          prefix:
            type: string
            optional: true
          conversion:
            type: string
            optional: true
          max_bytes:
            type: int
            optional: true
          max_items:
            type: int
            optional: true
          max_item_bytes:
            type: int
            optional: true
          omit:
            type: bool
            optional: true
  processes:
    type: list
    items:
      name:
        type: string
      factory_package:
        type: string
  proto_files:
    type: list
    items:
      path:
        type: string
      import_path:
        type: string
requires:
  - auth-provider
  - tracing
provides:
  - application-grpc-processes
slots: []

# The architecture role (ST-SUP-EN09 field Architecture role, ST-SUP-UC01-R05): the layer, the part in a request
# flow, and the side of each port. The architecture model places the component from it alone.
architecture:
  layer: edge
  flow: "Serves the gRPC calls of the service's processes."
  ports:
    auth-provider: outbound
    tracing: outbound
    application-grpc-processes: inbound
