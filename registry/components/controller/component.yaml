kind: component
name: controller
version: 1.25.1
stage: ga
output_namespace: controller
requires: []
provides:
  - reconciliation-runtime
slots: []

# The architecture role (ST-SUP-EN09 field Architecture role, ST-SUP-UC01-R05): the layer, the part in a request
# flow, and the side of each port. The architecture model places the component from it alone.
architecture:
  layer: handler
  flow: "Reconciles each declared resource toward the state that its spec asks for."
  ports:
    reconciliation-runtime: inbound
