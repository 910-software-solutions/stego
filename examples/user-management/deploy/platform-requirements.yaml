# The platform requirements of the service: what its environment must supply, and every environment variable
# that it accepts. stego apply writes this file from the declaration and the needs and environment variables of its
# components. Do not edit it: change the declaration or the registry.
version: 2
service: user-management
requirements:
  - kind: secret
    name: user-management-database
    keys:
      - url
      - worker-url
    components:
      - postgres-adapter
  - kind: secret
    name: user-management-database-owner
    keys:
      - url
    components:
      - postgres-adapter
  - kind: secret
    name: user-management-database-relay
    keys:
      - url
    components:
      - spicedb-authz
  - kind: secret
    name: user-management-kafka-client
    keys:
      - ca-crt
      - password
    components:
      - kafka-producer
  - kind: secret
    name: user-management-query-cursor
    keys:
      - key
    components:
      - query
  - kind: secret
    name: user-management-spicedb
    keys:
      - preshared-key
    components:
      - spicedb-authz
  - kind: configuration
    name: STEGO_SPICEDB_ENDPOINT
    components:
      - spicedb-authz
  - kind: configuration
    name: STEGO_SPICEDB_KEY_FILE
    components:
      - spicedb-authz
  - kind: backing store
    name: user-management-db
    engine: postgres
    components:
      - postgres-adapter
  - kind: topic
    name: user-management-events
    variable: STEGO_KAFKA_TOPIC
    access: write
    components:
      - kafka-producer
  - kind: identity issuer
    name: user-management-issuer
    variable: STEGO_AUTH_ISSUER
    components:
      - jwt-auth
  - kind: ingress
    name: http
    port: 8080
    components:
      - health-check
  - kind: egress
    name: spicedb
    port: 50051
    components:
      - spicedb-authz
  - kind: egress
    name: user-management-db-network
    port: 5432
    components:
      - postgres-adapter
  - kind: egress
    name: user-management-issuer-keys
    port: 443
    components:
      - jwt-auth
  - kind: egress
    name: user-management-kafka
    port: 9093
    components:
      - kafka-producer
  - kind: pod security
    name: pod-security
    level: restricted
    components:
      - health-check
environment:
  - name: CORS_ALLOWED_HEADERS
    read_by:
      - rest-api
    type: list
    required: false
    default: Content-Type,Authorization
    description: The request headers that cross-origin requests may send. When it has no value, the API allows Content-Type and Authorization.
    secret: false
    read_by_mode: api
  - name: CORS_ALLOWED_METHODS
    read_by:
      - rest-api
    type: list
    required: false
    default: GET,POST,PATCH,PUT,DELETE,OPTIONS
    description: The HTTP methods that cross-origin requests may use. When it has no value, the API allows GET, POST, PATCH, PUT, DELETE and OPTIONS.
    secret: false
    read_by_mode: api
  - name: CORS_ALLOWED_ORIGINS
    read_by:
      - rest-api
    type: list
    required: false
    description: The origins that may send cross-origin requests. When it has no value, the API sets no CORS header.
    secret: false
    read_by_mode: api
  - name: DATABASE_URL
    read_by:
      - postgres-adapter
    type: string
    required: false
    description: The PostgreSQL connection string of the runtime role, or DATABASE_URL_FILE in its place, not the two. The process does not start when the two have no value.
    secret: true
    secret_source:
      name: user-management-database
      key: url
    one_of: database-url
  - name: DATABASE_URL_FILE
    read_by:
      - postgres-adapter
    type: path
    required: false
    description: The file that holds the PostgreSQL connection string of the runtime role. Give it or DATABASE_URL, not the two.
    secret: false
    one_of: database-url
  - name: GODEBUG
    read_by:
      - command
    type: string
    required: false
    description: 'Read by the Go runtime and standard library: settings that change their behavior. The service does not start when it holds a tls or x509 setting, because that can turn off a TLS check.'
    secret: false
  - name: GOGC
    read_by:
      - command
    type: string
    required: false
    default: "100"
    description: 'Read by the Go runtime: the garbage collection target as a percent, or off. When it has no value, it is 100.'
    secret: false
  - name: GOMAXPROCS
    read_by:
      - command
    type: integer
    required: false
    description: 'Read by the Go runtime: the most operating system threads that run Go code at one time. When it has no value, the runtime uses the CPU limit.'
    secret: false
    allowed: 1 to 1024
  - name: GOMEMLIMIT
    read_by:
      - command
    type: string
    required: false
    description: 'Read by the Go runtime: the soft memory limit of the process, such as 512MiB. When it has no value, there is no limit.'
    secret: false
  - name: GOTRACEBACK
    read_by:
      - command
    type: string
    required: false
    default: single
    description: 'Read by the Go runtime: how much a crash report shows. When it has no value, it shows the goroutine that failed.'
    secret: false
    allowed: none, single, all, system, crash
  - name: GRPC_ALTS_MAX_CONCURRENT_HANDSHAKES
    read_by:
      - otel-tracing
    type: string
    required: false
    description: Read by the gRPC library. The service does not start when it has a value, because it can change how gRPC connects or what it logs.
    secret: false
    refused_at_start: true
  - name: GRPC_BINARY_LOG_FILTER
