# Version 1.1.0 holds the revocation status route in the operation-to-permission table, from which alone the router
# registers it (ST-SUP-RC29-OC18), and the settings wait_cap, waiter_limit and tenant_waiter_limit of a wait for a
# revocation (ST-SUP-RC29-OC19). Version 1.1.1 refuses a wait_cap above 25 s, so a full wait leaves time to answer
# before the server's write timeout of 30 s. Version 1.1.2 adds authz_token only when the catalog does not hold it, so
# a run again of the migration job takes no lock on a protected table (ST-SUP-RC29-OC06). Version 1.1.3 refuses an
# alert_bound above 10 minutes and a watch_interval below 100 ms or above the alert_bound (ST-SUP-RC29-OC24). Version
# 1.1.4 quotes the table name in the authz migration as an identifier and as a string literal (ST-SUP-RC29-OC06).
# Version 1.1.5 refuses a protected table name that holds a $ (ST-SUP-RC29-OC06). Version 1.2.0 holds Provision and
# Retire of the declared tenant provisioning in the operation-to-permission table, from which alone the router registers
# their routes (ST-SUP-RC27-OC09, ST-SUP-RC29-OC15).
kind: component
name: spicedb-authz
# Version 1.6.0 gives the relay the definitions of the schema as its types, so the relay of a release leaves a
# tuple of a type or a relation of a newer release to the relay of that release (ST-SUP-RP01-LC40,
# ST-SUP-RP06-LC06; walkthrough 23, P2-R).
version: 1.6.0
stage: ga
output_namespace: internal/authz

config:
  alert_bound:
    type: string
    default: 5s
  watch_interval:
    type: string
    default: 1s
  wait_cap:
    type: string
    default: 10s
  waiter_limit:
    type: int
    default: 100
  tenant_waiter_limit:
    type: int
    default: 10

requires:
  - auth-provider

provides:
  - authz-decision
  - authz-relationships

slots: []

# The architecture role (ST-SUP-EN09 field Architecture role, ST-SUP-UC01-R05): the layer, the part in a request
# flow, and the side of each port. The architecture model places the component from it alone.
architecture:
  layer: authentication
  flow: "Asks SpiceDB whether the caller holds the permission of the operation."
  ports:
    auth-provider: outbound
    authz-decision: inbound
    authz-relationships: inbound

environment:
  - name: STEGO_SPICEDB_ENDPOINT
    type: address
    required: true
    description: "The host and port of SpiceDB. The service does not start when it has no value."
    secret: false
    example: "spicedb.example.svc:50051"
  - name: STEGO_SPICEDB_KEY_FILE
    type: path
    required: true
    description: "The file of the preshared key of SpiceDB. The service does not start when it has no value."
    secret: false
    secret_source: {name: "{service}-spicedb", key: preshared-key}
    example: "/etc/stego/spicedb/key"
  - name: STEGO_SPICEDB_INSECURE_LOOPBACK
    type: boolean
    required: false
    default: "0"
    description: "Set to 1 to let a loopback SpiceDB address go without TLS, for a local test only. When it has no value, the connection needs TLS."
    secret: false
    allowed: {values: ["0", "1"]}
# The platform needs (ST-SUP-EN09): the preshared key of SpiceDB, the connection string of the relay role and the
# network path to SpiceDB on its gRPC port.
needs:
  - {kind: secret, name: "{service}-spicedb", keys: [preshared-key]}
  - {kind: secret, name: "{service}-database-relay", keys: [url]}
  - {kind: egress, name: spicedb, port: 50051}
