# Version 1.7.0 refuses a route on a stream query, which is served over gRPC only (ST-DECL-INV73, walkthrough 12,
# W12-B2), and names the repository of an entity with the plural of the table names, such as GetEntryEntries, with
# the old name as a deprecated function for one release (walkthrough 12, W12-B5).
# Version 1.6.0 gives each problem of a query the type of its code under the problem base, and registers the
# optional extra key of the list cursors (ST-SUP-RC33-OC12, ST-SUP-RP11-LC23).
# Version 1.4.0 answers a get query on a key that is not a UUID as a missing row, 404 over HTTP and NotFound over
# gRPC, before any statement or decision (walkthrough 10, B4; ST-SUP-RC33-OC05).
kind: component
name: query
version: 1.7.0
stage: ga
output_namespace: queries

config: {}

requires:
  - storage-adapter

provides:
  - queries

slots: []

# The architecture role (ST-SUP-EN09 field Architecture role, ST-SUP-UC01-R05): the layer, the part in a request
# flow, and the side of each port. The architecture model places the component from it alone.
architecture:
  layer: handler
  flow: "Runs the declared query for the caller and gives back its rows."
  serves: [queries]
  ports:
    storage-adapter: outbound
    queries: inbound

environment:
  - name: STEGO_QUERY_CURSOR_KEY_FILE
    read_by_mode: api
    type: path
    required: false
    description: "The file of the key of the list cursors, at least 32 bytes, the same in each replica. Only the api mode reads it, and the api mode does not start when it has no value."
    secret: false
    secret_source: {name: "{service}-query-cursor", key: key}
    read_with: service
    example: "/etc/stego/query/cursor-key"
  - name: STEGO_QUERY_CURSOR_EXTRA_KEY_FILE
    read_by_mode: api
    type: path
    required: false
    description: "The file of a second key of the list cursors, which opens a cursor and seals none: the new key before it seals, or the old key after a rotation. It must differ from the key."
    secret: false
    read_with: service
    example: "/etc/stego/query/cursor-extra-key"
# The platform needs (ST-SUP-EN09): the key of the list cursors, the same in each replica.
needs:
  - {kind: secret, name: "{service}-query-cursor", keys: [key]}
