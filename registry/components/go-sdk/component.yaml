# Version 2.1.0 makes the client from the OpenAPI document of the service when the declaration gives no document
# (ST-SUP-RC06-OC09).
kind: component
name: go-sdk
version: 2.1.0
stage: ga
output_namespace: sdk
config:
  document:
    type: string
  references:
    type: list
    items:
      type: string
requires: []
provides:
  - application-go-sdk
slots: []

# The architecture role (ST-SUP-EN09 field Architecture role, ST-SUP-UC01-R05): the layer, the part in a request
# flow, and the side of each port. The architecture model places the component from it alone.
architecture:
  layer: edge
  flow: "Gives callers a typed Go client of the service's API."
  ports:
    application-go-sdk: inbound

environment: []
