kind: component
name: domain-probe
version: 1.1.0
stage: ga
output_namespace: probes

config: {}

requires: []

provides:
  - domain-probes

slots: []

# The architecture role (ST-SUP-EN09 field Architecture role, ST-SUP-UC01-R05): the layer, the part in a request
# flow, and the side of each port. The architecture model places the component from it alone.
architecture:
  layer: handler
  flow: "Runs the declared domain probes and reports what they observe."
  ports:
    domain-probes: inbound

environment:
  - name: STEGO_LOG_LEVEL
    type: string
    required: false
    default: "info"
    description: "The lowest severity of the log lines on standard output and standard error: debug, info, warn or error. When it has no value, the level is info."
    secret: false
    example: "warn"
    allowed: {values: ["debug", "info", "warn", "error"]}
  - name: STEGO_PROBE_CONSOLE
    type: string
    required: false
    default: "off"
    description: "The format of the domain probe values on standard output. When it has no value, the probes write nothing to standard output."
    secret: false
    example: "json"
    allowed: {values: ["json", "logfmt", "off"]}
