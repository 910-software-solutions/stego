kind: component
name: query
version: 1.1.0
stage: ga
output_namespace: queries

config: {}

requires: []

provides:
  - queries

slots: []

# The architecture role (ST-SUP-EN09 field Architecture role, ST-SUP-UC01-R05): the layer, the part in a request
# flow, and the side of each port. The architecture model places the component from it alone.
architecture:
  layer: handler
  flow: "Runs the declared query for the caller and gives back its rows."
  ports:
    queries: inbound
