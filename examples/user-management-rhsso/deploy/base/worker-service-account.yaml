# The Kubernetes base of the service. stego apply writes this file from the declaration and the platform
# requirements, with no value that differs per environment: the platform's overlay supplies them, and every
# overlay must set the image by digest, because the image of the base is a name that no registry serves. Do not
# edit it.
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/component: worker
    app.kubernetes.io/name: user-management-worker
    app.kubernetes.io/part-of: user-management
  name: user-management-worker
