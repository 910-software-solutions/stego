# Version 1.4.0 disables export on a page with no deployment setting also when the caller gives sampleRatio: an
# option only reduces the deployment ratio and never enables a signal (ST-SUP-RC03-OC12, ST-SUP-RC03-OC13).
# Version 1.5.0 changes the README only: an ID that beginTrace takes must be random (security review of PR #494, I1).
kind: component
name: browser-telemetry
version: 1.5.0
stage: ga
output_namespace: browsertelemetry
config:
  service_name:
    type: string
    optional: true
requires: []
provides:
  - browser-telemetry
slots: []

# The architecture role (ST-SUP-EN09 field Architecture role, ST-SUP-UC01-R05): the layer, the part in a request
# flow, and the side of each port. The architecture model places the component from it alone.
architecture:
  layer: edge
  flow: "Receives the telemetry that the browser sends."
  ports:
    browser-telemetry: inbound

environment: []
