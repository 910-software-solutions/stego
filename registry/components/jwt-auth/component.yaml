kind: component
name: jwt-auth
version: 2.5.0
stage: ga
output_namespace: internal/auth

config:
  mode:
    type: string
    default: middleware
    enum: [middleware, verifier]
  header:
    type: string
    default: Authorization
  issuer:
    type: string
  audience:
    type: string
  public_key_file:
    type: string
  roles_claim:
    type: string

requires: []

provides:
  - auth-provider

slots: []

# The architecture role (ST-SUP-EN09 field Architecture role, ST-SUP-UC01-R05): the layer, the part in a request
# flow, and the side of each port. The architecture model places the component from it alone.
architecture:
  layer: authentication
  flow: "Checks the token of the request and puts the caller's identity on it."
  ports:
    auth-provider: inbound
