kind: component
name: browser-telemetry
version: 1.3.0
stage: ga
output_namespace: browsertelemetry
config:
  service_name:
    type: string
    optional: true
requires: []
provides:
  - browser-telemetry
slots: []

# The architecture role (ST-SUP-EN09 field Architecture role, ST-SUP-UC01-R05): the layer, the part in a request
# flow, and the side of each port. The architecture model places the component from it alone.
architecture:
  layer: edge
  flow: "Receives the telemetry that the browser sends."
  ports:
    browser-telemetry: inbound
