# kafka-consumer reads the change events of another service from Kafka (decision on ST-SUP-Q158, 2026-11-17). A declared
# subscription selects it (ST-GEN-INV37); while it is alpha, the declaration carries an experimental acceptance that
# names it. In the worker mode the Kafka inbox of the runtime, kafkainbox, reads the topic in its consumer group,
# checks each record, and writes each record that it takes into the outbox for the worker that consumes the
# subscription, with an ID that a redelivery gives again (ST-SUP-RP01-LC35 to ST-SUP-RP01-LC38). The connection
# settings are the STEGO_KAFKA_ settings of the Kafka destination.
kind: component
name: kafka-consumer
version: 0.1.0
stage: alpha
sunset: 2027-05-31
output_namespace: internal/subscriptions

config: {}
requires:
  - durable-outbox
provides:
  - subscriptions
slots: []

# The architecture role (ST-SUP-EN09 field Architecture role, ST-SUP-UC01-R05): the layer, the part in a request
# flow, and the side of each port. The architecture model places the component from it alone.
architecture:
  layer: outside call
  flow: "Reads the change events of another service and writes each one into the outbox for its worker."
  ports:
    durable-outbox: outbound
    subscriptions: inbound

environment:
  - name: STEGO_KAFKA_BROKERS
    type: list
    required: false
    description: "The seed brokers, 1 to 16 host:port items, or STEGO_KAFKA_BROKERS_FILE in its place. The worker does not start when the two have no value."
    secret: false
    one_of: kafka-brokers
    example: "kafka-0.example.com:9093,kafka-1.example.com:9093"
  - name: STEGO_KAFKA_BROKERS_FILE
    type: path
    required: false
    description: "The file that holds the list of seed brokers. Give it or STEGO_KAFKA_BROKERS, not the two."
    secret: false
    one_of: kafka-brokers
    example: "/etc/stego/kafka/brokers"
  - name: STEGO_KAFKA_BROKER_HOSTS
    type: list
    required: false
    description: "The hosts that the worker may dial, at most 64, or STEGO_KAFKA_BROKER_HOSTS_FILE in its place. When the two have no value, the worker dials each broker that a broker names."
    secret: false
    example: "kafka-0.example.com,kafka-1.example.com"
  - name: STEGO_KAFKA_BROKER_HOSTS_FILE
    type: path
    required: false
    description: "The file that holds the list of the hosts that the worker may dial. Give it or STEGO_KAFKA_BROKER_HOSTS, not the two."
    secret: false
    example: "/etc/stego/kafka/broker-hosts"
  - name: STEGO_KAFKA_CA_FILE
    type: path
    required: false
    description: "A PEM file of certificate authorities that the worker adds to the system roots. When it has no value, the worker uses the system roots."
    secret: false
    example: "/etc/stego/kafka/ca.crt"
  - name: STEGO_KAFKA_CLIENT_CERT_FILE
    type: path
    required: false
    description: "The file of the PEM client certificate of mutual TLS. Give it with STEGO_KAFKA_CLIENT_KEY_FILE."
    secret: false
    example: "/etc/stego/kafka/tls.crt"
  - name: STEGO_KAFKA_CLIENT_KEY_FILE
    type: path
    required: false
    description: "The file of the PEM client key of mutual TLS. Give it with STEGO_KAFKA_CLIENT_CERT_FILE."
    secret: false
    example: "/etc/stego/kafka/tls.key"
  - name: STEGO_KAFKA_SASL_MECHANISM
    type: string
    required: false
    description: "The SASL mechanism. When it has no value, the worker uses no SASL and needs a client certificate."
    secret: false
    example: "SCRAM-SHA-512"
    allowed: {values: ["SCRAM-SHA-512", "OAUTHBEARER"]}
  - name: STEGO_KAFKA_USERNAME
    type: string
    required: false
    description: "The SCRAM user name. Give it or STEGO_KAFKA_USERNAME_FILE when the mechanism is SCRAM-SHA-512."
    secret: false
    example: "orders-worker"
  - name: STEGO_KAFKA_USERNAME_FILE
    type: path
    required: false
    description: "The file that holds the SCRAM user name. Give it or STEGO_KAFKA_USERNAME, not the two."
    secret: false
    example: "/etc/stego/kafka/username"
  - name: STEGO_KAFKA_PASSWORD_FILE
    type: path
    required: false
    description: "The file of the SCRAM password. The mechanism SCRAM-SHA-512 needs it."
    secret: false
    example: "/etc/stego/kafka/password"
  - name: STEGO_KAFKA_TOKEN_FILE
    type: path
    required: false
    description: "The file of the OAUTHBEARER token. The mechanism OAUTHBEARER needs it."
    secret: false
    example: "/etc/stego/kafka/token"
  - name: STEGO_KAFKA_INSECURE_LOOPBACK
    type: boolean
    required: false
    default: "0"
    description: "Set to 1 to let loopback brokers go without TLS, for a local test only. When it has no value, each broker needs TLS."
    secret: false
    allowed: {values: ["0", "1"]}
  - name: STEGO_KAFKA_CONSUMER_TOPIC
    type: string
    required: false
    description: "The topic of the change events of the source service, which the inbox reads. Give it or STEGO_KAFKA_CONSUMER_TOPIC_FILE; the worker mode does not start when the two have no value."
    secret: false
    one_of: kafka-consumer-topic
    example: "orders-events"
  - name: STEGO_KAFKA_CONSUMER_TOPIC_FILE
    type: path
    required: false
    description: "The file that holds the topic that the inbox reads. Give it or STEGO_KAFKA_CONSUMER_TOPIC, not the two."
    secret: false
    one_of: kafka-consumer-topic
    example: "/etc/stego/kafka/consumer-topic"
  - name: STEGO_KAFKA_CONSUMER_GROUP
    type: string
    required: false
    description: "The consumer group of the inbox, or STEGO_KAFKA_CONSUMER_GROUP_FILE in its place. When the two have no value, the group is <service>.<subscription>."
    secret: false
    example: "fulfilment.order-changes"
  - name: STEGO_KAFKA_CONSUMER_GROUP_FILE
    type: path
    required: false
    description: "The file that holds the consumer group of the inbox. Give it or STEGO_KAFKA_CONSUMER_GROUP, not the two."
    secret: false
    example: "/etc/stego/kafka/consumer-group"
  - name: STEGO_KAFKA_CONSUMER_ACCEPT_INFINITE_RETENTION
    type: boolean
    required: false
    default: "0"
    description: "Set to 1 to let the inbox read a topic with an infinite retention. Then an offset reset to a record older than the outbox done retention can apply that record twice."
    secret: false
    allowed: {values: ["0", "1"]}
# The platform needs (ST-SUP-EN09): the topic of the source service's change events, which the service reads in its
# consumer group, and the network path to the brokers on their TLS port.
needs:
  - {kind: topic, name: "{service}-subscription", variable: STEGO_KAFKA_CONSUMER_TOPIC}
  - {kind: egress, name: "{service}-kafka", port: 9093}
