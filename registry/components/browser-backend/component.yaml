kind: component
name: browser-backend
version: 4.13.0
stage: ga
output_namespace: browser
config:
  dynamic_styles:
    type: bool
    optional: true
  additional_scopes:
    type: list
    optional: true
    items:
      type: string
  telemetry_service_name:
    type: string
    optional: true
  # Every declaration gives its API prefix and its routes (ST-DECL-INV90).
  api_prefix:
    type: string
    author_supplied: true
  # The other APIs that the proxy reaches, each with its own prefix and its one fixed origin (ST-SUP-RC02-OC58).
  apis:
    type: list
    optional: true
    items:
      name:
        type: string
      prefix:
        type: string
  logout_scope:
    type: string
    optional: true
  roles_claim:
    type: string
    optional: true
  routes:
    type: list
    author_supplied: true
    items:
      type: string
  asset_bundle:
    type: string
    optional: true
  assets:
    type: list
    optional: true
    items:
      source:
        type: string
      path:
        type: string
requires:
  - storage-adapter
  - tracing
  - health-endpoint
provides:
  - browser-session-http
slots: []

# The architecture role (ST-SUP-EN09 field Architecture role, ST-SUP-UC01-R05): the layer, the part in a request
# flow, and the side of each port. The architecture model places the component from it alone.
architecture:
  layer: edge
  flow: "Serves the browser session over HTTP and passes its calls to the service."
  ports:
    storage-adapter: outbound
    tracing: outbound
    health-endpoint: outbound
    browser-session-http: inbound

environment:
  # The mode migrate reads the name of the runtime login and the owner connection (ST-SUP-RC02-OC56); postgres-adapter
  # states the owner connection with the same facts.
  - name: STEGO_RUNTIME_DATABASE_ROLE
    type: string
    required: false
    description: "The name of the runtime login, to which the migration job grants the session table. The job does not start when it has no value or when the value is not a lower-case role name."
    secret: false
    read_by_mode: migrate
    example: "portal_runtime"
  - name: STEGO_MIGRATION_DATABASE_URL
    type: string
    required: false
    description: "The PostgreSQL connection string of the migration job, or STEGO_MIGRATION_DATABASE_URL_FILE in its place, not the two. The process does not start when the two have no value."
    secret: true
    one_of: migration-database-url
    secret_source: {name: "{service}-database-owner", key: url}
    read_by_mode: migrate
  - name: STEGO_MIGRATION_DATABASE_URL_FILE
    type: path
    required: false
    description: "The file that holds the PostgreSQL connection string of the migration job. Give it or STEGO_MIGRATION_DATABASE_URL, not the two."
    secret: false
    one_of: migration-database-url
    read_by_mode: migrate
    example: "/etc/stego/database-owner/url"
  - name: STEGO_HTTP_TLS_CERT
    type: path
    required: false
    description: "The file of the PEM TLS certificate of the HTTP server. The browser backend does not start when it has no value."
    secret: false
    secret_source: {name: "{service}-tls", key: tls-crt}
    example: "/etc/stego/tls/tls.crt"
  - name: STEGO_HTTP_TLS_KEY
    type: path
    required: false
    description: "The file of the PEM TLS private key of the HTTP server. The browser backend does not start when it has no value."
    secret: false
    secret_source: {name: "{service}-tls", key: tls-key}
    example: "/etc/stego/tls/tls.key"
  - name: STEGO_BROWSER_ORIGIN
    type: url
    required: true
    description: "The HTTPS origin of the browser backend. The backend does not start when it has no value."
    secret: false
    example: "https://app.example.com"
  - name: STEGO_BROWSER_API_URL
    type: url
    required: false
    description: "The HTTPS origin of the service API, which a local application must not have. In other cases, the backend does not start when it has no value."
    secret: false
    example: "https://api.example.com"
  - name: STEGO_BROWSER_API_URLS
    type: string
    required: false
    description: "The HTTPS origin of each API of the setting apis, as a comma list of name=origin. The backend does not start when the list does not give each declared name one time and no other name."
    secret: false
    example: "fulfilment=https://fulfilment.example.com,billing=https://billing.example.com"
  - name: STEGO_BROWSER_API_CA_FILE
    type: path
    required: false
    description: "A PEM file of certificate authorities for the service API. When it has no value, the backend uses the system roots."
    secret: false
    example: "/etc/stego/browser/api-ca.crt"
  - name: STEGO_BROWSER_ISSUER
    type: url
    required: true
    description: "The HTTPS URL of the OpenID Connect issuer. The backend does not start when it has no value."
    secret: false
    example: "https://sso.example.com/realms/main"
  - name: STEGO_BROWSER_ISSUER_CA_FILE
    type: path
    required: false
    description: "A PEM file of certificate authorities for the issuer. When it has no value, the backend uses the system roots."
    secret: false
    example: "/etc/stego/browser/issuer-ca.crt"
  - name: STEGO_BROWSER_CLIENT_ID
    type: string
    required: true
    description: "The OAuth client ID of the browser backend. The backend does not start when it has no value."
    secret: false
    example: "orders-browser"
  - name: STEGO_BROWSER_CLIENT_SECRET_FILE
    type: path
    required: true
    description: "The file of the OAuth client secret. The backend does not start when it has no value."
    secret: false
    secret_source: {name: "{service}-browser", key: client-secret}
    example: "/etc/stego/browser/client-secret"
  - name: STEGO_BROWSER_SESSION_KEY_FILE
    type: path
    required: true
    description: "The file of the keys that encrypt the browser sessions. The backend does not start when it has no value."
    secret: false
    secret_source: {name: "{service}-browser", key: session-keys}
    example: "/etc/stego/browser/session-keys"
# The platform needs (ST-SUP-EN09): the TLS certificate of the backend, the OAuth client secret and the session keys,
# the OpenID Connect issuer and the network path to it, the HTTP port and the pod security level.
needs:
  - {kind: secret, name: "{service}-tls", keys: [tls-crt, tls-key]}
  - {kind: secret, name: "{service}-browser", keys: [client-secret, session-keys]}
  - {kind: identity issuer, name: "{service}-issuer", variable: STEGO_BROWSER_ISSUER}
  - {kind: egress, name: "{service}-issuer-keys", port: 443}
  - {kind: ingress, name: http, port: 8080}
  - {kind: pod security, name: pod-security, level: restricted}
