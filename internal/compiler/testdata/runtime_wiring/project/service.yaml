kind: service
name: wiring-shop
archetype: rest-crud
language: go
base_path: /api/shop/v1
error_type_base: https://errors.example.com/shop/
tenancy:
  kind: pooled
  key: tenant_id
  claim: tenant
  # Provision gives each first administrator that its body names the relation admin in the new tenant (ST-SUP-RC27-OC13).
  provisioning: {resource_type: service, provision: provision, retire: retire, admin: admin}
authorization:
  provider: spicedb
  schema_path: authz/schema.zed
  subject_from_identity: user
audit:
  level: change
idempotency:
  required_on: [create]
# The change events of the collections go to Kafka through the outbox (ST-SUP-RC20-OC40, ST-SUP-RC18-OC31).
mixins:
  - event-publisher
experimental_acceptances:
  - {component: tenancy, accepted_until: 2027-04-30, reason: the runtime data path needs pooled tenancy}
  - {component: spicedb-authz, accepted_until: 2027-04-30, reason: the runtime data path decides each permission}
  - {component: audit-log, accepted_until: 2027-04-30, reason: the runtime data path audits each write}
  - {component: idempotency, accepted_until: 2027-04-30, reason: the runtime data path keys each create}
  - {component: worker, accepted_until: 2027-04-30, reason: the generated service runs its declared workers}
overrides:
  jwt-auth:
    issuer: https://issuer.wiring.test/realms/r1
    audience: wiring-shop
  audit-log:
    anchor_period: 2s
  postgres-adapter:
    schema_generation: tables-v1
    writer_lease: "off"
  command:
    proto_files:
      - {path: proto/shop.proto, import_path: shop/v1/shop.proto}
entities:
  - name: Order
    resource_type: order
    permissions: {create: public, read: view, list: view, patch: edit, delete: edit}
    public_reasons: {create: a new order has no resource to decide on before it exists}
    fields:
      - {name: sku, type: string}
      - {name: qty, type: int32}
      # A readable secret, sealed at rest, and a compare-only secret, stored as its hash (ST-DECL-Q44), whose wrong
      # checks the runtime counts (ST-SUP-RP10-LC54).
      - {name: api_token, type: string, sensitivity: secret, optional: true, min_length: 8}
      - {name: pin, type: string, sensitivity: secret, compare_only: true, optional: true, min_length: 4, attempts: {limit: 100}}
  - name: Note
    resource_type: note
    permissions: {read: view}
    references:
      order_id: {relation: order, permission: edit}
    fields:
      - {name: order_id, type: ref, to: Order}
      - {name: text, type: string}
collections:
  orders:
    entity: Order
    operations: [create, read, list, patch, delete]
    patchable: [qty, api_token]
commands:
  - name: add-note
    writes: [Note, Order]
    resource_type: order
    permission: edit
    resource_member: orderId
    route: POST /orders/{orderId}/notes
    fill: add-note
    effects:
      - {destination: note-replies, name: note-added}
  # The fill reads the readable secret of the order and checks the compare-only one, as only the code of the service
  # may (ST-SUP-RP10-LC45).
  - name: verify-order
    writes: [Order]
    resource_type: order
    permission: view
    resource_member: orderId
    route: POST /orders/{orderId}/verify
    fill: verify-order
queries:
  - name: get-order-summary
    reads: [Order]
    resource_type: order
    permission: view
    resource_member: orderId
    route: GET /orders/{orderId}/summary
    fill: get-order-summary
# The worker sync-partner-orders adds one to the qty of the seeded order in each tenant of the list whose ID starts
# with org-w at each tick, and apply-note-replies consumes the messages that add-note stages, in the transaction of
# the outbox worker as the worker role (ST-SUP-RC35, ST-SUP-Q136).
workers:
  - name: sync-partner-orders
    trigger: every 10s
    writes: [Order]
    resource_type: order
    permission: sync
    fill: sync-partner-orders
  - name: apply-note-replies
    trigger: consumes note-replies
    writes: [Order]
    resource_type: order
    permission: sync
    fill: apply-note-replies
