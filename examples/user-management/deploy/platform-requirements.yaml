    secret: false
    allowed: grpc
  - name: OTEL_LOGS_EXPORTER
    read_by:
      - otel-tracing
    type: string
    required: false
    default: otlp
    description: Set to none to stop the export of logs. When it has no value, the service exports logs with OTLP.
    secret: false
    allowed: otlp, none
  - name: OTEL_METRICS_EXPORTER
    read_by:
