# Version 1.8.0 states the gRPC variables as read by the api mode, and the TLS files as not required on their own
# and required when the process runs the api mode, as grpc-application 2.4.0 does, so that a service can list both
# components with no conflict of the variables (security review of PR #465, I1).
kind: component
name: grpc-processes
version: 1.8.0
stage: ga
output_namespace: grpcapi
config:
  response_mappings:
    type: list
    items:
      name:
        type: string
      provider:
        type: string
      model:
        type: string
      message:
        type: string
      inputs:
        type: list
        optional: true
        items:
          name:
            type: string
          type:
            type: string
          optional:
            type: bool
            optional: true
      fields:
        type: list
        items:
          target:
            type: string
          source:
            type: string
            optional: true
          input:
            type: string
            optional: true
          constant:
            type: string
            optional: true
          prefix:
            type: string
            optional: true
          conversion:
            type: string
            optional: true
          max_bytes:
            type: int
            optional: true
          max_items:
            type: int
            optional: true
          max_item_bytes:
            type: int
            optional: true
          omit:
            type: bool
            optional: true
  processes:
    type: list
    items:
      name:
        type: string
      factory_package:
        type: string
  proto_files:
    type: list
    items:
      path:
        type: string
      import_path:
        type: string
requires:
  - auth-provider
  - tracing
provides:
  - application-grpc-processes
slots: []

# The architecture role (ST-SUP-EN09 field Architecture role, ST-SUP-UC01-R05): the layer, the part in a request
# flow, and the side of each port. The architecture model places the component from it alone.
architecture:
  layer: edge
  flow: "Serves the gRPC calls of the service's processes."
  ports:
    auth-provider: outbound
    tracing: outbound
    application-grpc-processes: inbound

environment:
  - name: STEGO_GRPC_ADDR
    type: address
    required: false
    default: "127.0.0.1:9090"
    description: "The address where the gRPC server listens. When it has no value, the server listens on 127.0.0.1:9090."
    secret: false
    read_by_mode: api
    example: "0.0.0.0:9090"
  - name: STEGO_GRPC_STREAM_TIMEOUT
    type: duration
    required: false
    default: "5m"
    description: "The longest time that a gRPC stream stays open. When it has no value, a stream stays open for 5 minutes."
    secret: false
    read_by_mode: api
    example: "2m30s"
    allowed: {min: "1s", max: "30m"}
  - name: STEGO_GRPC_STREAM_IO_TIMEOUT
    type: duration
    required: false
    default: "10s"
    description: "The longest time for one send or receive on a gRPC stream. When it has no value, the limit is 10 seconds."
    secret: false
    read_by_mode: api
    example: "5s"
    allowed: {min: "1s", max: "10s"}
  - name: STEGO_GRPC_TLS_CERT
    type: path
    required: false
    required_when: "the process runs the api mode"
    description: "The file of the PEM TLS certificate of the gRPC server. The server does not start when it has no value."
    secret: false
    secret_source: {name: "{service}-grpc-tls", key: tls-crt}
    read_by_mode: api
    example: "/etc/stego/tls/tls.crt"
  - name: STEGO_GRPC_TLS_KEY
    type: path
    required: false
    required_when: "the process runs the api mode"
    description: "The file of the PEM TLS private key of the gRPC server. The server does not start when it has no value."
    secret: false
    secret_source: {name: "{service}-grpc-tls", key: tls-key}
    read_by_mode: api
    example: "/etc/stego/tls/tls.key"
  - name: STEGO_RPC_MONITOR_ADDR
    type: address
    required: false
    default: "127.0.0.1:9082"
    description: "The loopback address of the health monitor of an RPC process. When it has no value, the monitor listens on 127.0.0.1:9082."
    secret: false
    example: "127.0.0.1:9182"
# The platform needs (ST-SUP-EN09): the TLS certificate of the gRPC server, its port and the pod security level.
needs:
  - {kind: secret, name: "{service}-grpc-tls", keys: [tls-crt, tls-key]}
  - {kind: ingress, name: grpc, port: 9090}
  - {kind: pod security, name: pod-security, level: restricted}
