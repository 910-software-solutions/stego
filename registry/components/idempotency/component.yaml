# Version 0.2.0 makes the rest-api handlers put Idempotency-Kept: 1 on each answer to a create or a patch with a key,
# and the OpenAPI document describe the header (ST-SUP-RC30-OC08, ST-SUP-Q193 (a)).
kind: component
name: idempotency
version: 0.2.0
stage: alpha
sunset: 2027-04-30
output_namespace: internal/idempotency

config: {}

requires: []

provides:
  - idempotency-keys

slots: []

# The architecture role (ST-SUP-EN09 field Architecture role, ST-SUP-UC01-R05): the layer, the part in a request
# flow, and the side of each port. The architecture model places the component from it alone.
architecture:
  layer: handler
  flow: "Gives back the stored answer of a request that repeats an idempotency key."
  ports:
    idempotency-keys: inbound

environment: []
