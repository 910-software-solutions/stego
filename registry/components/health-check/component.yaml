kind: component
name: health-check
version: 1.1.0
stage: ga
output_namespace: health

config:
  database:
    type: bool

requires: []

provides:
  - health-endpoint

slots: []

# The architecture role (ST-SUP-EN09 field Architecture role, ST-SUP-UC01-R05): the layer, the part in a request
# flow, and the side of each port. The architecture model places the component from it alone.
architecture:
  layer: edge
  flow: "Answers /livez and /readyz for the platform."
  ports:
    health-endpoint: inbound
