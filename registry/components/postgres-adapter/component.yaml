# The platform needs (ST-SUP-EN09): the PostgreSQL database and the connection strings of its roles. No name holds a
# setting, so no secret setting can reach a name (#331 security review F1).
needs:
  - {kind: backing store, name: "{service}-db", engine: postgres}
  - {kind: secret, name: "{service}-database", keys: [url, worker-url]}
  # The credential of the owner role, which only the migration Job reads, is in a Secret of its own that no serving
  # pod references (ST-DLV-Q20).
  - {kind: secret, name: "{service}-database-owner", keys: [url]}
  - {kind: egress, name: "{service}-db-network", port: 5432}
